name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile and desktop browser regressions
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/glyphforge-preview.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/
          npm run test:mobile
          npm run test:files
          npm run test:history

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-editor-chromium
          path: |
            artifacts/mobile/
            artifacts/files/
            artifacts/history/
